[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spaceward"
version = "0.1.0"
description = "Preventive disk guardian agent: investigates what changed, classifies safety with evidence, deletes nothing without approval, verifies nothing broke."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spaceward = "spaceward.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceward"]
